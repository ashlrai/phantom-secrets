[package]
name = "phantom-secrets-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Secret vault backends for Phantom Secrets — OS keychain and encrypted file"
keywords = ["secrets", "vault", "keychain", "encryption", "ai-safety"]
categories = ["cryptography", "development-tools", "authentication"]

[lib]
name = "phantom_vault"
path = "src/lib.rs"

[dependencies]
phantom-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
keyring-core = { workspace = true }
directories = "5"
dirs = "5"
rand = { workspace = true }
hex = { workspace = true }

# Encryption for file vault
chacha20poly1305 = "0.10"
argon2 = "0.5"

# Advisory file locking (cross-platform)
fs2 = "0.4"

# Secret-name hashing so keychain metadata doesn't leak names (audit F13)
sha2 = "0.10"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Use the OS-maintained libdbus; do not bundle its separately licensed C code.
# Linux source builds need libdbus development files and pkg-config.
# Keep pure-Rust cryptography; OpenSSL remains banned by deny.toml.
dbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
