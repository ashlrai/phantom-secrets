[package]
name = "phantom-secrets-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Secret vault backends for Phantom Secrets — OS keychain and encrypted file"
keywords = ["secrets", "vault", "keychain", "encryption", "ai-safety"]
categories = ["cryptography", "development-tools", "authentication"]

[lib]
name = "phantom_vault"
path = "src/lib.rs"

[dependencies]
phantom-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# keyring 4 split credential stores into per-backend crates on keyring-core.
# The Linux Secret Service store uses the blocking D-Bus implementation so the
# unmaintained zvariant/zbus_names/zvariant_derive chain (zbus 4/5) stays out
# of the tree; no keyring backend crate ships zbus 6 yet. See #242.
keyring-core = "1"
directories = "5"
dirs = "5"
rand = { workspace = true }
hex = { workspace = true }

# Encryption for file vault
chacha20poly1305 = "0.10"
# `zeroize` scrubs Argon2 internal hash state (initial hash, final block).
argon2 = { version = "0.5", features = ["zeroize"] }

# Advisory file locking (cross-platform)
fs2 = "0.4"

# Secret-name hashing so keychain metadata doesn't leak names (audit F13)
sha2 = "0.10"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocking Secret Service over the `dbus` crate: `vendored` builds bundled
# libdbus so Linux CI needs no libdbus-1-dev; `crypto-rust` keeps the DH key
# exchange on RustCrypto (no openssl).
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
linux-keyutils-keyring-store = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
