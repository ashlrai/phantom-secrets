[package]
name = "phantom-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Open-source CLI that prevents AI coding agents from leaking your API keys"
keywords = ["secrets", "api-keys", "ai-safety", "claude-code", "mcp"]
categories = ["command-line-utilities", "development-tools", "cryptography"]

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
phantom-core = { workspace = true }
phantom-vault = { workspace = true }
phantom-proxy = { workspace = true }
phantom-mcp = { workspace = true }
phantom-workspace = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
colored = "2"
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
open = "5"
which = "6"
dirs = "5"
arboard = { version = "3", default-features = false }
indicatif = "0.18"
base64 = { workspace = true }
notify = "8.2"
rpassword = "7"
self_update = { version = "1.2", default-features = false, features = ["reqwest", "rustls", "github", "progress-bar", "checksums", "compression-tar-gz", "compression-zip-deflate", "archive-tar", "archive-zip"] }
toml = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
