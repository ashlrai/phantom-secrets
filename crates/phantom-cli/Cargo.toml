[package]
name = "phantom-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Open-source CLI that reduces API-key exposure on supported AI-agent workflows"
keywords = ["secrets", "api-keys", "ai-safety", "claude-code", "mcp"]
categories = ["command-line-utilities", "development-tools", "cryptography"]

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
phantom-core = { workspace = true }
phantom-vault = { workspace = true }
phantom-proxy = { workspace = true }
phantom-mcp = { workspace = true }
phantom-workspace = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
colored = "2"
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
open = "5"
which = "6"
dirs = "5"
directories = "5"
arboard = { version = "3", default-features = false }
indicatif = "0.18"
base64 = { workspace = true }
notify = "8.2"
rpassword = "7"
self_update = { version = "1.2", default-features = false, features = ["reqwest", "rustls", "github", "progress-bar", "checksums", "compression-tar-gz", "archive-tar"] }
# Windows release assets are .zip. self_update 1.x still pins the zip 8 line
# (every zip 8 release is yanked), so upgrade.rs extracts the one expected
# binary itself with zip 9 and swaps it in with self-replace.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
self-replace = "1"
tempfile = "3"
toml = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2"
wiremock = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
