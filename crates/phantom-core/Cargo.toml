[package]
name = "phantom-secrets-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Core library for Phantom Secrets — config, .env parsing, token generation"
keywords = ["secrets", "env", "dotenv", "config", "ai-safety"]
categories = ["development-tools", "config", "parser-implementations"]

[lib]
name = "phantom_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
base64 = { workspace = true }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
tokio = { workspace = true }
tempfile = "3"

# Team-vault envelope encryption: X25519 + ChaCha20-Poly1305 via crypto_box
# (sealed-box style with ephemeral sender keys per push for forward secrecy).
crypto_box = { version = "0.9", features = ["chacha20"] }
# Used directly by teams_vault for symmetric encryption of the vault blob
# itself (the per-push sym key, distinct from the per-recipient X25519 wrap).
chacha20poly1305 = "0.10"
glob = "0.3"
hmac = "0.12"
sha2 = "0.10"
fs2 = "0.4"
dirs = "5"
lazy_static = "1"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
# RS256 signing of the in-process GitHub App JWT minted from the vaulted PEM
# (issuance → rotation bootstrap). No key generation here — signing only.
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }

[dev-dependencies]
# Generate a throwaway RSA keypair at test runtime so the issuance/JWT tests
# stay hermetic and offline WITHOUT committing any private-key material. See the
# `[profile.dev.package.*]` opt-level overrides in the workspace Cargo.toml that
# keep keygen fast in the debug/test profile.
rsa = "0.9"
