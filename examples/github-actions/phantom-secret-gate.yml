# Copy to .github/workflows/phantom-secret-gate.yml in your project.
#
# Fails a pull request when it adds a raw provider key to code, or leaves a
# raw value in a committed dotenv file. It runs the same `phantom check` the
# local pre-commit hook runs; it never needs your vault or any secret.
name: Phantom secret gate
on:
  pull_request:

permissions:
  contents: read

jobs:
  phantom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the immutable Phantom v0.7.9 Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.9 --repo ashlrai/phantom-secrets \
            --pattern phantom-x86_64-unknown-linux-gnu.tar.gz \
            --pattern phantom-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c phantom-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf phantom-x86_64-unknown-linux-gnu.tar.gz
          install -d "$HOME/.local/bin"
          install -m 0755 phantom "$HOME/.local/bin/"
          rm -f phantom phantom-mcp phantom-x86_64-unknown-linux-gnu.tar.gz*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: No raw values in committed dotenv files
        run: phantom check

      - name: No raw provider keys added by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Stage the whole PR diff against its base, then scan exactly the
          # lines this PR adds, the way the pre-commit hook scans a commit.
          git reset --soft "$BASE_SHA"
          phantom check --staged
