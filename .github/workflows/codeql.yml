# CodeQL advanced setup. Replaces repo-level default setup, which ran on every
# PR push without cancelling superseded runs. Same languages and default query
# suite; Rust uses build-mode none, so there is no cargo build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # Nightly default-suite scan.
    - cron: "53 6 * * *"
    # Weekly full scan with the security-extended suite.
    - cron: "29 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #811 classify pattern: docs-only PRs skip analysis. Non-PR events always scan.
  classify:
    name: Classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      languages: ${{ steps.classify.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all='["actions","javascript-typescript","python","ruby","rust"]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "languages=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          docs='^(docs/|.*\.md$|LICENSE|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE)'
          code=false
          # Capture first: an early-exit grep -q under pipefail can SIGPIPE grep -Ev and skip analysis.
          code_paths="$(printf '%s\n' "$files" | grep -Ev "$docs" || [ $? -eq 1 ])"
          if [ -n "$code_paths" ]; then code=true; fi
          # Scan only the languages whose files changed (RQ-CI-FANOUT). A change
          # to this workflow scans every language. Push, merge_group, schedule
          # and dispatch always scan all five.
          langs=()
          has() { printf '%s\n' "$files" | grep -Eiq "$1"; }
          if has '^\.github/workflows/codeql\.yml$'; then langs=(actions javascript-typescript python ruby rust)
          else
            if has '^\.github/(workflows|actions)/|(^|/)action\.ya?ml$'; then langs+=(actions); fi
            if has '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue|html?)$|(^|/)package(-lock)?\.json$'; then langs+=(javascript-typescript); fi
            if has '\.(py|pyi)$|(^|/)(requirements[^/]*\.txt|pyproject\.toml|setup\.(py|cfg))$'; then langs+=(python); fi
            if has '\.(rb|erb|gemspec|rake)$|(^|/)(Gemfile(\.lock)?|Rakefile)$'; then langs+=(ruby); fi
            if has '\.rs$|(^|/)Cargo\.(toml|lock)$'; then langs+=(rust); fi
          fi
          if [ "${#langs[@]}" -eq 0 ]; then code=false; json='[]'
          else json="[$(printf '"%s",' "${langs[@]}" | sed 's/,$//')]"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "languages=$json" >> "$GITHUB_OUTPUT"
          echo "code=$code languages=$json"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: classify
    if: needs.classify.outputs.code == 'true' && needs.classify.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Every language uses build-mode none.
        language: ${{ fromJSON(needs.classify.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: ${{ github.event.schedule == '29 5 * * 0' && 'security-extended' || '' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Weekly security-extended results get their own category so the nightly
          # default-suite run does not close the extra alerts.
          category: /language:${{ matrix.language }}${{ github.event.schedule == '29 5 * * 0' && '/extended' || '' }}
