# CodeQL advanced setup. Replaces repo-level default setup, which ran on every
# PR push without cancelling superseded runs. Same languages and default query
# suite; Rust uses build-mode none, so there is no cargo build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # Nightly default-suite scan.
    - cron: "53 6 * * *"
    # Weekly full scan with the security-extended suite.
    - cron: "29 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #811 classify pattern: docs-only PRs skip analysis. Non-PR events always scan.
  classify:
    name: Classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      langs: ${{ steps.classify.outputs.langs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all=',actions,javascript-typescript,python,ruby,rust,'
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "langs=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          docs='^(docs/|.*\.md$|LICENSE|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE)'
          code=false
          # Capture first: an early-exit grep -q under pipefail can SIGPIPE grep -Ev and skip analysis.
          code_paths="$(printf '%s\n' "$files" | grep -Ev "$docs" || true)"
          if [ -n "$code_paths" ]; then code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"
          # Languages this PR touches; a change to this workflow scans all of them.
          langs=','
          if printf '%s\n' "$files" | grep -Eq '^\.github/workflows/codeql\.yml$'; then langs="$all"
          else
            sel() { if printf '%s\n' "$code_paths" | grep -Eq "$2"; then langs="${langs}$1,"; fi; }
            sel actions '^\.github/(workflows|actions)/|(^|/)action\.ya?ml$'
            sel javascript-typescript '\.(js|mjs|cjs|jsx|ts|tsx|mts|cts|vue|svelte|astro)$|(^|/)package(-lock)?\.json$'
            sel python '\.py$|(^|/)requirements[^/]*\.txt$|(^|/)pyproject\.toml$'
            sel ruby '\.rb$|(^|/)Gemfile(\.lock)?$|\.gemspec$'
            sel rust '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain(\.toml)?$'
          fi
          echo "langs=$langs" >> "$GITHUB_OUTPUT"
          echo "langs=$langs"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: rust
            build-mode: none
    # Skip-step pattern: every Analyze (<language>) job still runs and reports
    # under its name. On a PR the scan steps run only for languages the PR
    # touches; push, merge_group, schedule and dispatch scan every language.
    env:
      SELECTED: ${{ contains(needs.classify.outputs.langs, format(',{0},', matrix.language)) }}
    steps:
      - name: Language selection
        env:
          LANGUAGE: ${{ matrix.language }}
        run: echo "language=$LANGUAGE selected=$SELECTED"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SELECTED == 'true'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: env.SELECTED == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ github.event.schedule == '29 5 * * 0' && 'security-extended' || '' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: env.SELECTED == 'true'
        with:
          # Weekly security-extended results get their own category so the nightly
          # default-suite run does not close the extra alerts.
          category: /language:${{ matrix.language }}${{ github.event.schedule == '29 5 * * 0' && '/extended' || '' }}
