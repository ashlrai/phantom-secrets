# CodeQL advanced setup. Replaces repo-level default setup, which ran on every
# PR push without cancelling superseded runs. Same languages and default query
# suite; Rust uses build-mode none, so there is no cargo build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # Nightly default-suite scan.
    - cron: "53 6 * * *"
    # Weekly full scan with the security-extended suite.
    - cron: "29 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #811 classify pattern: docs-only PRs skip analysis. Non-PR events always scan.
  classify:
    name: Classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          docs='^(docs/|.*\.md$|LICENSE|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE)'
          code=false
          # Capture first: an early-exit grep -q under pipefail can SIGPIPE grep -Ev and skip analysis.
          code_paths="$(printf '%s\n' "$files" | grep -Ev "$docs" || true)"
          if [ -n "$code_paths" ]; then code=true; fi
          # Rust analysis (~9 min) runs on PRs only when workflows change (G1);
          # otherwise on merge_group, every push to main and nightly.
          rust=false
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then rust=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "code=$code rust=$rust"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - if: matrix.language != 'rust' || needs.classify.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language != 'rust' || needs.classify.outputs.rust == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ github.event.schedule == '29 5 * * 0' && 'security-extended' || '' }}
      - if: matrix.language != 'rust' || needs.classify.outputs.rust == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Weekly security-extended results get their own category so the nightly
          # default-suite run does not close the extra alerts.
          category: /language:${{ matrix.language }}${{ github.event.schedule == '29 5 * * 0' && '/extended' || '' }}
