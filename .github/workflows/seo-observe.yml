name: SEO observation

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-observe-production
  cancel-in-progress: true

jobs:
  observe:
    name: Observe public search and agent-discovery surfaces
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify the observer and its privacy boundary
        run: node --test scripts/seo/observe.test.mjs
      - name: Observe the deployed public surface
        run: |
          set -euo pipefail
          observation_dir="${RUNNER_TEMP}/phantom-seo-observation"
          mkdir -p "$observation_dir"
          node scripts/seo/observe.mjs \
            --experiments seo/experiments.json \
            --out "$observation_dir/observation.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain the sanitized observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phantom-seo-observation
          path: ${{ runner.temp }}/phantom-seo-observation/observation.json
          if-no-files-found: warn
          retention-days: 30
