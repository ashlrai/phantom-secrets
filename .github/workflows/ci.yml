name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue reruns every job on the queued merge commit so CI Gate reports there.
  merge_group:
  workflow_dispatch:

# Scope GITHUB_TOKEN down — CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs of the same PR so agents pushing fixups do not queue
# behind stale builds. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Test and check builds keep file:line debug info (enough for panics and
  # backtraces) instead of full debug info. Measured on the workspace: the
  # target dir drops from 7.4 GB to 3.5 GB (less rust-cache to restore and
  # save) and a workspace rebuild over cached deps from 52s to 41s on Linux;
  # linking is the larger share on Windows and macOS. Release builds are
  # configured separately and are unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PHANTOM_NPM_AUDIT_VERSION: 11.15.0

jobs:
  # Path classification. Docs-only changes skip the Rust/web suites; secret
  # scanning and dependency policy always run. Pushes to main and manual runs
  # always run everything. The `CI Gate` job below is the single required
  # check, so skipped jobs never leave a required status pending.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      temporal_example: ${{ steps.classify.outputs.temporal_example }}
      docs_commands: ${{ steps.classify.outputs.docs_commands }}
      filterset: ${{ steps.affected.outputs.filterset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "temporal_example=true" >> "$GITHUB_OUTPUT"
            # The full Test job already runs the docs command check here.
            echo "docs_commands=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          docs='^(docs/|[^/]*\.md$|.*/README\.md$|LICENSE|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE)'
          web='^(apps/web/|scripts/supabase/|scripts/seo/|\.github/workflows/)'
          # Rust/CLI suites: anything that is neither docs nor web-only nor the video sandbox.
          # scripts/supabase and scripts/seo are exercised only by the web job.
          rust=false; webc=false
          if printf '%s\n' "$files" | grep -Ev "$docs" | grep -Ev '^(apps/web/|scripts/supabase/|scripts/seo/|video/)' | grep -q .; then rust=true; fi
          if printf '%s\n' "$files" | grep -Eq '^\.github/workflows/'; then rust=true; fi
          if printf '%s\n' "$files" | grep -Eq "$web"; then webc=true; fi
          # The Temporal codec example (Python) has its own job.
          temporal=false
          if printf '%s\n' "$files" | grep -Eq '^(examples/temporal-codec-python/|\.github/workflows/)'; then temporal=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "web=$webc" >> "$GITHUB_OUTPUT"
          echo "temporal_example=$temporal" >> "$GITHUB_OUTPUT"
          # Files docs_command_flags_test reads. Docs-only and web-only PRs skip
          # the Test job, so run that one test on its own for them.
          docs_commands=false
          if printf '%s\n' "$files" | grep -Eq '^(README\.md$|docs/[^/]+\.md$|apps/web/src/|apps/web/public/llms[^/]*\.txt$|\.github/workflows/)'; then docs_commands=true; fi
          echo "docs_commands=$docs_commands" >> "$GITHUB_OUTPUT"
          echo "rust=$rust web=$webc temporal_example=$temporal docs_commands=$docs_commands"
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            fs="$(bash scripts/ci/affected-filterset.sh "$BASE" "$HEAD" || echo 'all()')"
          else
            fs='all()'
          fi
          echo "filterset=$fs" >> "$GITHUB_OUTPUT"
          echo "nextest filterset: $fs"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # Linking the workspace's test binaries with link.exe is most of the
      # Windows Build step (86-107s vs 44s on Linux). rust-lld ships with the
      # toolchain; the variable only applies to the x86_64 MSVC target.
      # rust-cache hashes CARGO_* variables into its key, so the first run after
      # this changes rebuilds dependencies once (253s) before the cache warms.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      # Third-party actions are pinned to commit SHAs (not floating tags) so
      # a future tag-move or account compromise on the action repo cannot
      # inject steps into our CI. Keep the trailing `# v…` comment so
      # dependabot knows what version is in effect.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --workspace --all-targets --locked --verbose
      # nextest runs every test in its own process, in parallel across all
      # test binaries. Same targets as `cargo test --all-targets` (which never
      # ran doctests); ignored tests stay ignored.
      # PRs test only the crates the diff touches plus every crate depending on
      # them (nextest rdeps filterset); workspace-wide changes (manifests,
      # lockfile, toolchain, CI) select all(). Pushes to main always run the
      # complete suite on every OS.
      - name: Run tests
        # PRs test only crates the diff touches plus their reverse deps
        # (computed in `changes`); main pushes always run all().
        if: needs.changes.outputs.filterset != 'none()'
        shell: bash
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast -E "${{ needs.changes.outputs.filterset }}"
      # The X-Wing hybrid share (team_crypto_pq) and its crypto registry drift
      # test compile only with the pq-hybrid feature. Other jobs only
      # `cargo check --all-features`, so these tests never ran in CI.
      - name: Run pq-hybrid feature tests
        if: runner.os == 'Linux' && needs.changes.outputs.filterset != 'none()'
        run: cargo test --locked -p phantom-secrets-core --features pq-hybrid --lib -- team_crypto_pq crypto_registry
      - name: Verify examples
        run: node --test scripts/examples-first-five-minutes.test.mjs scripts/agent-first-five-minutes.test.mjs scripts/examples-client-recipes.test.mjs
      - name: Verify installed CLI and MCP onboarding
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          const suffix = process.platform === 'win32' ? '.exe' : '';
          const result = spawnSync(process.execPath, [
            'examples/agent-first-five-minutes/run.mjs',
            '--phantom', join(process.cwd(), 'target', 'debug', `phantom${suffix}`),
            '--mcp', join(process.cwd(), 'target', 'debug', `phantom-mcp${suffix}`),
          ], { stdio: 'inherit' });
          if (result.error || result.signal) process.exit(1);
          process.exit(result.status ?? 1);
          NODE
      - name: Verify platform and installer mappings
        run: node scripts/check-platform-installers.mjs
      - name: Verify MCP platform mappings
        run: node npm-mcp/test/platform-matrix.test.js
      # The registry catalog is what MCP Registry publication ships. It was
      # only compared with the runtime tools/list at release build, so a tool
      # schema change on main (#201) left it stale until the next tag. Same
      # smoke and tool count as release-build.yml, against the debug build.
      - name: Verify MCP registry catalog matches runtime tools/list
        if: runner.os == 'Linux'
        run: node scripts/release/mcp-stdio-smoke.mjs target/debug/phantom-mcp 54
      - name: Run direct installer offline tests
        if: runner.os == 'Linux'
        run: node --test scripts/installers.test.js scripts/release/native-installer-acceptance.test.mjs
      - name: Parse candidate and public-reference PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          [void][scriptblock]::Create((Get-Content -LiteralPath scripts/install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath apps/web/public/install.ps1 -Raw))
          if (-not (Select-String -LiteralPath scripts/install.ps1 -Pattern '\$CandidateTag = ''v0.7.9''' -Quiet)) {
            throw 'candidate PowerShell installer is not pinned to v0.7.9'
          }
          if (-not (Select-String -LiteralPath apps/web/public/install.ps1 -Pattern '\$CandidateTag = ''v0.7.9''' -Quiet)) {
            throw 'public-reference PowerShell installer is not pinned to evidenced v0.7.9'
          }
      - name: Exercise the Windows installer with the existing debug binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $PWD 'phantom-x86_64-pc-windows-msvc.zip'
          Push-Location target/debug
          try {
            Compress-Archive -LiteralPath phantom.exe, phantom-mcp.exe -DestinationPath $archive
          } finally {
            Pop-Location
          }
          $version = (Get-Content -LiteralPath npm/package.json -Raw | ConvertFrom-Json).version
          $env:PHANTOM_NATIVE_ARCHIVE = $archive
          $env:PHANTOM_NATIVE_TARGET = 'x86_64-pc-windows-msvc'
          $env:PHANTOM_RELEASE_TAG = "v$version"
          node scripts/release/native-installer-acceptance.mjs

  test-ignored:
    name: Ignored Tests (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run ignored tests (real OS keychain)
        run: cargo test --locked -p phantom-secrets-vault os_keychain_roundtrip -- --ignored

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
      - name: Install verified cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="/tmp/cargo-deny-${CARGO_DENY_VERSION}.tar.gz"
          install_dir="/tmp/phantom-cargo-deny-bin"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny
          "$install_dir/cargo-deny" --version
      - name: Check advisories, licenses, bans, duplicates, and sources
        run: /tmp/phantom-cargo-deny-bin/cargo-deny --all-features --locked check --deny warnings advisories licenses bans sources

  windows-arm-source-check:
    name: Windows ARM64 source check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-11-vs2026-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
      # This job compiled every dependency from scratch on each run (~2.5 min).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify native host and check the workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $rustcDetails = rustc -vV | Out-String
          if ($rustcDetails -notmatch '(?m)^host: aarch64-pc-windows-msvc\r?$') {
            throw "expected native Windows ARM64 Rust host; got:`n$rustcDetails"
          }
          cargo check --workspace --all-targets --all-features --locked

  npm-wrappers:
    name: npm wrapper tests and package inspection
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test and inspect primary CLI wrapper on Node 22
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run
      - name: Test and inspect MCP wrapper on Node 22
        working-directory: npm-mcp
        run: |
          npm test
          npm pack --dry-run
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test primary CLI wrapper on Node 24
        working-directory: npm
        run: npm test
      - name: Test MCP wrapper on Node 24
        working-directory: npm-mcp
        run: npm test

  web:
    name: Web security, tests, and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify immutable migration source contract
        run: node --test ../../scripts/supabase/verify-migrations.test.mjs
      - name: Install from the lockfile
        run: npm ci --no-audit
      - name: Install the exact npm audit CLI
        run: |
          npm install \
            --prefix "${RUNNER_TEMP}/phantom-npm-audit" \
            --cache "${RUNNER_TEMP}/phantom-npm-audit-cache" \
            --registry=https://registry.npmjs.org/ \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-save \
            --package-lock=false \
            "npm@${PHANTOM_NPM_AUDIT_VERSION}"
          "${RUNNER_TEMP}/phantom-npm-audit/node_modules/.bin/npm" --version | grep -Fx "${PHANTOM_NPM_AUDIT_VERSION}"
      - name: Audit production dependencies
        run: >-
          "${RUNNER_TEMP}/phantom-npm-audit/node_modules/.bin/npm"
          audit --omit=dev --audit-level=moderate
      - name: Lint web source
        run: npm run lint
      - name: Run web security and auth tests
        run: npm test
      - name: Verify credential-free SEO observation contract
        run: node --test ../../scripts/seo/observe.test.mjs
      - name: Build the production application
        run: npm run build
      - name: Install pinned Supabase CLI
        # This exact CLI release fixes the local service-image compatibility set;
        # config.toml separately pins the Postgres image major version.
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Confirm exact Supabase CLI version
        run: test "$(supabase --version)" = "2.116.0"
      - id: start_database
        name: Start isolated local database
        run: supabase db start
      - name: Replay every migration from an empty local database
        run: supabase db reset --local --no-seed
      - name: Verify local migration history
        run: supabase migration list --local
      - name: Verify hosted grant ownership assumptions
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --file ../../scripts/supabase/assert-hosted-grants-preflight.sql
      - name: Assert local database authority boundaries
        env:
          PGPASSWORD: postgres
        run: |
          psql --version
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --file ../../scripts/supabase/assert-local-authority.sql
      - name: Test Data API grants and row isolation
        run: supabase test db --local supabase/tests/database
      - name: Emit exact hosted Data API grant receipt
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --file ../../scripts/supabase/receipt-hosted-grants.sql
      - name: Lint local schema
        run: supabase db lint --local --level warning --fail-on warning
      - name: Run local security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on warn
      - name: Tear down local database and delete its volumes
        if: ${{ always() && steps.start_database.outcome != 'skipped' }}
        run: supabase stop --no-backup

  secret-scan:
    name: Source secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch canonical origin heads for history policy
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="/tmp/phantom-gitleaks-bin"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version
      - name: Scan current source with the reviewed fixture policy
        run: /tmp/phantom-gitleaks-bin/gitleaks dir . --config .gitleaks.toml --redact --no-banner --max-target-megabytes 5 --timeout 60

      - name: Validate exact candidate and canonical-origin history policy
        run: |
          node --test scripts/release/validate-gitleaks-ignore.test.mjs
          node scripts/release/validate-gitleaks-ignore.mjs .gitleaksignore HEAD

      - name: Scan candidate and canonical origin ancestry against reviewed fingerprints
        run: /tmp/phantom-gitleaks-bin/gitleaks git . --log-opts='HEAD --remotes=origin' --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --no-banner --max-target-megabytes 5 --timeout 120

  crate-publication-contract:
    name: Crate publication contract
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test fail-closed publication and release receipts
        run: |
          node scripts/release/check-version-parity.mjs
          node --test scripts/examples-first-five-minutes.test.mjs scripts/publish-crates.test.js scripts/release/check-glibc-baseline.test.mjs scripts/release/extract-release-notes.test.mjs scripts/release/pre-tag-preflight.test.mjs scripts/release/readme-mcp-catalog.test.mjs scripts/release/release-receipts.test.mjs scripts/release/release-rehearsal-contract.test.mjs
      - name: Install checksum-verified MCP Registry publisher
        run: bash scripts/release/install-mcp-publisher.sh
      - name: Validate the staged MCP Registry manifest
        run: /tmp/phantom-mcp-publisher-bin/mcp-publisher validate mcp-registry/server.json
      # fmt, clippy and the full test suite are the Lint and Test jobs; the
      # gate requires both, so this job only packages and verifies crates.
      # --publish still runs every source gate itself.
      - name: Package every crates.io crate in dependency order
        run: ./scripts/publish-crates.sh --verify-only --skip-source-gates

  temporal-codec-example:
    name: Temporal codec example tests
    needs: changes
    if: needs.changes.outputs.temporal_example == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner's own python3, no extra action. Exact versions, wheels only,
      # every file hash-checked against requirements-ci.txt.
      - name: Install pinned dependencies
        working-directory: examples/temporal-codec-python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary=:all: -r requirements-ci.txt
      # Fake keys only; the HTTP tests bind 127.0.0.1. A skipped test fails
      # the job, so a missing dependency cannot pass silently.
      - name: Run codec, CORS and key delivery tests
        working-directory: examples/temporal-codec-python
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -m unittest -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -q 'skipped' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::a Temporal codec example test was skipped"; exit 1
          fi

  docs-commands:
    name: Docs command check
    needs: changes
    if: needs.changes.outputs.docs_commands == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-24)
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Checks every documented `phantom ...` command and flag in README.md,
      # docs/*.md, apps/web sources and llms*.txt against the CLI's --help.
      - name: Documented phantom commands match the CLI
        run: cargo test --locked -p phantom-secrets --test docs_command_flags_test

  # The single required status check. Fails if any job failed or was
  # cancelled, or if a job the classifier selected did not succeed. A job may
  # be skipped only when the classifier deselected it (or, for Ignored Tests,
  # outside workflow_dispatch).
  gate:
    name: CI Gate
    if: always()
    needs: [changes, test, test-ignored, lint, dependency-policy, windows-arm-source-check, npm-wrappers, web, secret-scan, crate-publication-contract, temporal-codec-example, docs-commands]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const ch = needs.changes;
          if (ch?.result !== 'success') throw new Error(`changes: ${ch?.result}`);
          const rust = ch.outputs.rust === 'true', web = ch.outputs.web === 'true';
          const temporalExample = ch.outputs.temporal_example === 'true';
          const docsCommands = ch.outputs.docs_commands === 'true';
          const always = ['dependency-policy', 'secret-scan'];
          const rustJobs = ['test', 'lint', 'windows-arm-source-check', 'npm-wrappers', 'crate-publication-contract'];
          const expect = {
            ...Object.fromEntries(always.map((j) => [j, true])),
            ...Object.fromEntries(rustJobs.map((j) => [j, rust])),
            web,
            'temporal-codec-example': temporalExample,
            'docs-commands': docsCommands,
            'test-ignored': process.env.EVENT === 'workflow_dispatch',
          };
          const bad = [];
          for (const [job, selected] of Object.entries(expect)) {
            const result = needs[job]?.result;
            if (selected ? result !== 'success' : result !== 'skipped') bad.push(`${job}=${result} (selected=${selected})`);
          }
          if (Object.keys(needs).length !== Object.keys(expect).length + 1) bad.push('gate inventory drift');
          if (bad.length) throw new Error(bad.join(', '));
          console.log(`CI Gate passed (rust=${rust}, web=${web}, temporal_example=${temporalExample}, docs_commands=${docsCommands})`);
          NODE
