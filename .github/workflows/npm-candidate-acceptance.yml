name: npm candidate acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pack the tagged source before npm publication, or verify published release-candidate versions
        required: true
        default: prepublication
        type: choice
        options:
          - prepublication
          - published-candidate
      version:
        description: Exact stable version without the v prefix
        required: true
        default: 0.7.8
        type: string
      release_source_sha:
        description: Exact 40-character commit SHA referenced by the annotated v<version> tag
        required: true
        type: string
      primary_integrity:
        description: Exact public phantom-secrets sha512 integrity; required only in published-candidate mode
        required: false
        type: string
      mcp_integrity:
        description: Exact public phantom-secrets-mcp sha512 integrity; required only in published-candidate mode
        required: false
        type: string
      previous_latest:
        description: Exact stable version both npm latest tags must retain throughout acceptance
        required: true
        default: 0.6.0
        type: string
      previous_candidate:
        description: Exact stable version both release-candidate tags must retain before publication
        required: true
        default: 0.7.4
        type: string

permissions:
  contents: read

concurrency:
  group: npm-candidate-acceptance-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  exact-version:
    name: npm ${{ inputs.mode }} (${{ matrix.target }})
    if: >-
      github.repository == 'ashlrai/phantom-secrets' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            runner_os: macOS
            runner_arch: X64
            platform: darwin
            arch: x64
          - target: aarch64-apple-darwin
            os: macos-15
            runner_os: macOS
            runner_arch: ARM64
            platform: darwin
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            runner_os: Linux
            runner_arch: X64
            platform: linux
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            runner_os: Linux
            runner_arch: ARM64
            platform: linux
            arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runner_os: Windows
            runner_arch: X64
            platform: win32
            arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-vs2026-arm
            runner_os: Windows
            runner_arch: ARM64
            platform: win32
            arch: arm64
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          # The smoke gate verifies the annotated tag object itself, not only
          # the detached commit to which the tag resolves.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          architecture: ${{ matrix.arch }}

      - name: Install the exact npm CLI into a private tool directory
        run: >-
          npm install
          --prefix "${{ runner.temp }}/phantom-npm-tool"
          --cache "${{ runner.temp }}/phantom-npm-bootstrap-cache"
          --registry=https://registry.npmjs.org/
          --ignore-scripts
          --no-audit
          --no-fund
          --no-save
          --package-lock=false
          npm@11.15.0

      - name: Execute both exact packages from fresh npm and binary caches
        env:
          GH_TOKEN: ${{ github.token }}
          PHANTOM_NPM_ACCEPTANCE_MODE: ${{ inputs.mode }}
          PHANTOM_NPM_ACCEPTANCE_VERSION: ${{ inputs.version }}
          PHANTOM_PREVIOUS_NPM_LATEST: ${{ inputs.previous_latest }}
          PHANTOM_PREVIOUS_NPM_CANDIDATE: ${{ inputs.previous_candidate }}
          PHANTOM_RELEASE_TAG: v${{ inputs.version }}
          PHANTOM_RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          PHANTOM_NPM_CLI: ${{ runner.temp }}/phantom-npm-tool/node_modules/npm/bin/npm-cli.js
          PHANTOM_APPROVED_PRIMARY_INTEGRITY: ${{ inputs.primary_integrity }}
          PHANTOM_APPROVED_MCP_INTEGRITY: ${{ inputs.mcp_integrity }}
          PHANTOM_EXPECTED_TARGET: ${{ matrix.target }}
          PHANTOM_EXPECTED_PLATFORM: ${{ matrix.platform }}
          PHANTOM_EXPECTED_ARCH: ${{ matrix.arch }}
          PHANTOM_EXPECTED_RUNNER_OS: ${{ matrix.runner_os }}
          PHANTOM_EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          PHANTOM_ACCEPTANCE_HOME: ${{ runner.temp }}/phantom-acceptance-home-${{ matrix.target }}
          PHANTOM_NPM_ACCEPTANCE_RECEIPT: ${{ github.workspace }}/npm-acceptance-receipt.json
        run: node scripts/release/npm-candidate-smoke.mjs

      - name: Preserve the per-host acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-acceptance-${{ inputs.mode }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: npm-acceptance-receipt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90
