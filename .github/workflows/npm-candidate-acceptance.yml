name: npm candidate acceptance

# Host acceptance reads seven format-checked outputs and starts only after the
# release rehearsal workflow succeeds on the default branch or a release tag.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pack the tagged source before npm publication, or verify published release-candidate versions
        required: true
        default: prepublication
        type: choice
        options:
          - prepublication
          - published-candidate
      version:
        description: Exact stable version without the v prefix
        required: true
        default: 0.8.11
        type: string
      release_source_sha:
        description: Exact 40-character commit SHA referenced by the annotated v<version> tag
        required: true
        type: string
      primary_integrity:
        description: Exact public phantom-secrets sha512 integrity; required only in published-candidate mode
        required: false
        type: string
      mcp_integrity:
        description: Exact public phantom-secrets-mcp sha512 integrity; required only in published-candidate mode
        required: false
        type: string
      previous_latest:
        description: Exact stable version both npm latest tags must retain throughout acceptance
        required: true
        default: 0.6.0
        type: string
      previous_candidate:
        description: Exact stable version both release-candidate tags must retain before publication
        required: true
        default: 0.7.4
        type: string

permissions:
  contents: read

concurrency:
  group: npm-candidate-acceptance-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate acceptance inputs
    if: >-
      !cancelled() &&
      github.repository == 'ashlrai/phantom-secrets' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      version: ${{ steps.check.outputs.version }}
      release_source_sha: ${{ steps.check.outputs.release_source_sha }}
      primary_integrity: ${{ steps.check.outputs.primary_integrity }}
      mcp_integrity: ${{ steps.check.outputs.mcp_integrity }}
      previous_latest: ${{ steps.check.outputs.previous_latest }}
      previous_candidate: ${{ steps.check.outputs.previous_candidate }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: check
        env:
          ACCEPTANCE_REF: ${{ github.ref }}
          ACCEPTANCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RAW_MODE: ${{ inputs.mode }}
          RAW_VERSION: ${{ inputs.version }}
          RAW_RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          RAW_PRIMARY_INTEGRITY: ${{ inputs.primary_integrity }}
          RAW_MCP_INTEGRITY: ${{ inputs.mcp_integrity }}
          RAW_PREVIOUS_LATEST: ${{ inputs.previous_latest }}
          RAW_PREVIOUS_CANDIDATE: ${{ inputs.previous_candidate }}
        run: node scripts/release/validate-npm-acceptance-dispatch.mjs

  rehearsal:
    name: Release rehearsal
    needs: validate-inputs
    if: >-
      !cancelled() &&
      github.repository == 'ashlrai/phantom-secrets' &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate-inputs.result == 'success' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    uses: ./.github/workflows/release-rehearsal.yml
    with:
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}

  exact-version:
    name: npm ${{ needs.validate-inputs.outputs.mode }} (${{ matrix.target }})
    needs: [validate-inputs, rehearsal]
    if: >-
      !cancelled() &&
      github.repository == 'ashlrai/phantom-secrets' &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate-inputs.result == 'success' &&
      needs.rehearsal.result == 'success' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            runner_os: macOS
            runner_arch: X64
            platform: darwin
            arch: x64
          - target: aarch64-apple-darwin
            os: macos-15
            runner_os: macOS
            runner_arch: ARM64
            platform: darwin
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            runner_os: Linux
            runner_arch: X64
            platform: linux
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            runner_os: Linux
            runner_arch: ARM64
            platform: linux
            arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runner_os: Windows
            runner_arch: X64
            platform: win32
            arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-vs2026-arm
            runner_os: Windows
            runner_arch: ARM64
            platform: win32
            arch: arm64
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.validate-inputs.outputs.version }}
          # The smoke gate verifies the annotated tag object itself, not only
          # the detached commit to which the tag resolves.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          architecture: ${{ matrix.arch }}

      - name: Install the exact npm CLI into a private tool directory
        run: >-
          npm install
          --prefix "${{ runner.temp }}/phantom-npm-tool"
          --cache "${{ runner.temp }}/phantom-npm-bootstrap-cache"
          --registry=https://registry.npmjs.org/
          --ignore-scripts
          --no-audit
          --no-fund
          --no-save
          --package-lock=false
          npm@11.15.0

      - name: Execute both exact packages from fresh npm and binary caches
        env:
          GH_TOKEN: ${{ github.token }}
          PHANTOM_NPM_ACCEPTANCE_MODE: ${{ needs.validate-inputs.outputs.mode }}
          PHANTOM_NPM_ACCEPTANCE_VERSION: ${{ needs.validate-inputs.outputs.version }}
          PHANTOM_PREVIOUS_NPM_LATEST: ${{ needs.validate-inputs.outputs.previous_latest }}
          PHANTOM_PREVIOUS_NPM_CANDIDATE: ${{ needs.validate-inputs.outputs.previous_candidate }}
          PHANTOM_RELEASE_TAG: v${{ needs.validate-inputs.outputs.version }}
          PHANTOM_RELEASE_SOURCE_SHA: ${{ needs.validate-inputs.outputs.release_source_sha }}
          PHANTOM_NPM_CLI: ${{ runner.temp }}/phantom-npm-tool/node_modules/npm/bin/npm-cli.js
          PHANTOM_APPROVED_PRIMARY_INTEGRITY: ${{ needs.validate-inputs.outputs.primary_integrity }}
          PHANTOM_APPROVED_MCP_INTEGRITY: ${{ needs.validate-inputs.outputs.mcp_integrity }}
          PHANTOM_EXPECTED_TARGET: ${{ matrix.target }}
          PHANTOM_EXPECTED_PLATFORM: ${{ matrix.platform }}
          PHANTOM_EXPECTED_ARCH: ${{ matrix.arch }}
          PHANTOM_EXPECTED_RUNNER_OS: ${{ matrix.runner_os }}
          PHANTOM_EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          PHANTOM_ACCEPTANCE_HOME: ${{ runner.temp }}/phantom-acceptance-home-${{ matrix.target }}
          PHANTOM_NPM_ACCEPTANCE_RECEIPT: ${{ github.workspace }}/npm-acceptance-receipt.json
        run: node scripts/release/npm-candidate-smoke.mjs

      - name: Preserve the per-host acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-acceptance-${{ needs.validate-inputs.outputs.mode }}-${{ needs.validate-inputs.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: npm-acceptance-receipt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90
