name: Nightly full matrix

# PRs and the merge queue run only fast checks (see ci.yml). This runs the
# full CI matrix, macOS and Windows included, on main daily at 04:07 ET (08:07 UTC),
# staggered from the other repos' daily runs so the macOS leg does not queue
# behind them (RQ-DAILY-15). A failure fails this run, which shows in the
# Actions tab and its run summary.
on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # id-token: write is only for ci.yml's coverage job (Codecov OIDC upload).
    permissions:
      contents: read
      id-token: write

  summary:
    name: Nightly summary
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report result
        env:
          RESULT: ${{ needs.ci.result }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Nightly full matrix"
            echo "Commit: \`$SHA\`"
            echo "Result: **$RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo "::error::Nightly full matrix concluded $RESULT on $SHA"
            exit 1
          fi
