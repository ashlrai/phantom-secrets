name: Nightly full matrix

# Push to main runs Linux only (see ci.yml). This runs the full CI matrix,
# macOS and Windows included, on main every night. A failure fails this run,
# which shows in the Actions tab and its run summary.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  summary:
    name: Nightly summary
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          RESULT: ${{ needs.ci.result }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Nightly full matrix"
            echo "Commit: \`$SHA\`"
            echo "Result: **$RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo "::error::Nightly full matrix concluded $RESULT on $SHA"
            exit 1
          fi
