name: pair-secrets

# phantom + phantom-secrets integration test, phantom-secrets side.
# Runs ONLY in the merge queue, so it is inert until merge_group is enabled
# on phantom-secrets. Path filtering happens in the job (merge_group events
# do not support `paths`). Uses release-built binaries from the release cache;
# no cargo build, no real secrets.
on:
  merge_group:

permissions:
  contents: read

env:
  PHANTOM_SECRETS_VERSION: v0.7.9

jobs:
  pair-secrets:
    name: pair-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Integration surface changed?
        id: surface
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE" "$HEAD")" || { echo "::error::diff failed"; exit 1; }
          if printf '%s\n' "$changed" | grep -Eq '^(crates/phantom-cli/src/commands/exec\.rs|crates/phantom-mcp/|crates/phantom-cli/src/commands/posture|crates/phantom-core/src/posture|scripts/integration/pair-secrets\.sh|\.github/workflows/pair-secrets\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore release binary cache
        if: steps.surface.outputs.run == 'true'
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pair-secrets/bin
          key: pair-secrets-${{ env.PHANTOM_SECRETS_VERSION }}-x86_64-linux
      - name: Fetch release binary on cache miss
        if: steps.surface.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          d=~/.cache/pair-secrets/bin; mkdir -p "$d"; cd "$d"
          a=phantom-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/ashlrai/phantom-secrets/releases/download/$PHANTOM_SECRETS_VERSION"
          curl -fsSL -o "$a" "$base/$a"
          curl -fsSL -o "$a.sha256" "$base/$a.sha256"
          sha256sum -c "$a.sha256"
          tar -xzf "$a" && rm -f "$a" "$a.sha256"
      # TODO(Phantom Core): restore the latest ashlrai/phantom release CLI from
      # the release cache and export PHANTOM_PAIR_BIN. Until then the receipt
      # assertion fails closed.
      - name: Run pair-secrets
        if: steps.surface.outputs.run == 'true'
        run: |
          export PHANTOM_SECRETS_BIN="$HOME/.cache/pair-secrets/bin"
          bash scripts/integration/pair-secrets.sh
