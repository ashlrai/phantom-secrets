name: 🐞 Bug report
description: Something works incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please run
        `phantom doctor` and paste the redacted output below — it captures most
        of what we'd otherwise need to ask for. For a suspected vulnerability,
        stop here and use GitHub private vulnerability reporting or the private
        email address in `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Phantom version
      description: Output of `phantom --version`
      placeholder: "paste the exact phantom --version output"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (x86_64)
        - Linux (aarch64)
        - Windows (x86_64)
        - Windows (aarch64)
        - WSL2
        - Other (please describe in repro)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was Phantom installed?
      options:
        - Reviewed GitHub release archive (include exact version)
        - Reviewed Homebrew third-party tap (include exact version)
        - npm or npx (include exact version and dist-tag)
        - Cargo install (older distribution track)
        - Built from source (include full SHA below)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Provider issuance or grant lifecycle
        - MCP server or editor integration
        - Local proxy
        - Vault or OS keychain
        - npm wrapper or release artifact
        - Phantom Cloud or team vault
        - Documentation
        - Unsure
    validations:
      required: true

  - type: input
    id: source_identity
    attributes:
      label: Source identity, if applicable
      description: For a source build, include the full commit SHA and whether the checkout was dirty. Otherwise write "not a source build."
      placeholder: "0123456789abcdef...; clean"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `phantom doctor`
      description: Redact credentials, cookies, device codes, cloud tokens, vault values, and persistent `phm_` mappings.
      render: shell
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `phantom init --empty` in an empty test directory
        2. Run `phantom add DEMO_API_KEY` and enter an obviously fake value at the terminal prompt
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include error output, but redact credentials and persistent `phm_` mappings; mappings are sensitive metadata.
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched [existing issues](https://github.com/ashlrai/phantom-secrets/issues?q=is%3Aissue) for this bug
          required: true
        - label: This report contains no real secret values, cookies, device codes, cloud tokens, vault contents, or persistent `phm_` mappings
          required: true
        - label: This is not a vulnerability report; security issues must use [private vulnerability reporting](https://github.com/ashlrai/phantom-secrets/security/advisories/new) or [security@ashlr.ai](mailto:security@ashlr.ai)
          required: true
