name: ✨ Feature request
description: Suggest a new capability or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation that prompted this request — the *why*, not the *what*.
      placeholder: "When I'm pair-programming with Claude Code in a monorepo, ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Phantom to do? Concrete CLI flags, MCP tool names, or UX flows are most useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, manual workarounds, or competing approaches you tried first.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched [existing issues](https://github.com/ashlrai/phantom-secrets/issues?q=is%3Aissue) and discussions for this request
          required: true
        - label: This request contains no credentials, cookies, device codes, vault contents, or persistent `phm_` mappings
          required: true
        - label: This is not a vulnerability report; suspected vulnerabilities use [private reporting](https://github.com/ashlrai/phantom-secrets/security/advisories/new)
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - CLI command
        - Provider issuance or grant lifecycle
        - MCP tool
        - Local proxy behavior
        - Vault or OS keychain
        - Workspace setup or execution-kernel foundation
        - Cloud sync (phm.dev)
        - Editor integration (Claude Code / Cursor / Windsurf / Codex)
        - Deployment-platform sync (Vercel / Railway / GitHub Actions)
        - Installation, packaging, or release trust
        - Documentation
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Security and authority impact
      description: Could this expose a value, mutate state, execute code, use a provider credential, broaden agent authority, or change confirmation/recovery behavior? If not, say why not.
    validations:
      required: true

  - type: dropdown
    id: evidence_layer
    attributes:
      label: Which evidence or availability layer should this change reach?
      description: Source, artifact, publication, deployment, provider activation, and user acceptance are separate outcomes.
      options:
        - Source or documentation only
        - Tested source candidate
        - Native release artifact
        - Package or registry publication
        - Deployed hosted service
        - Provider integration activation
        - Customer or user acceptance
        - Unsure
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and rollback
      description: What observable result proves this works, and how should partial or failed application be contained or rolled back?
    validations:
      required: true

  - type: textarea
    id: platforms
    attributes:
      label: Platform considerations
      description: Note expected macOS, Linux, Windows, shell, architecture, keychain, or packaging differences.
    validations:
      required: false
