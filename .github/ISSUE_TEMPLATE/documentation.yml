name: 📚 Documentation report
description: Report inaccurate, missing, or confusing project documentation.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        A small, evidence-backed docs fix can go straight to a pull request
        instead of an issue. Follow
        [Contribute with an agent](https://github.com/ashlrai/phantom-secrets/blob/main/CONTRIBUTING.md#contribute-with-an-agent)
        and run the docs drift checks listed there; pull request CI does not
        run them.

  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link to the page, heading, command help, or machine-readable surface.
      placeholder: "docs/getting-started.md#install"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current wording or gap
      description: Quote only the smallest relevant excerpt, or describe what is missing.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Evidence and proposed correction
      description: Point to code, tests, an immutable release, or another source that supports the correction.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer does the documentation describe?
      description: Name the exact release version or commit SHA in your evidence above. The options stay version-free so this form does not go stale.
      options:
        - A published GitHub release (name the exact version)
        - A Homebrew tap release (name the exact version)
        - An npm package release (name the exact version and dist-tag)
        - Current main source (name the commit SHA)
        - Native artifact or package publication
        - Deployed cloud or provider configuration
        - Roadmap or exploratory design
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: This report contains no credentials, cookies, device codes, vault contents, or persistent `phm_` mappings
          required: true
        - label: This is not a vulnerability report; suspected vulnerabilities use [private reporting](https://github.com/ashlrai/phantom-secrets/security/advisories/new)
          required: true
