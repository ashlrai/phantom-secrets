name: Phantom CI Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unprotected secrets
        run: npx phantom-secrets check

      - name: Build
        run: npm ci && npm run build

# Direct Phantom Cloud pulls from GitHub Actions are not supported in this
# release. Sync deploy-time secrets to Vercel or Railway with `phantom sync`,
# then let that platform inject secrets during deployment.
