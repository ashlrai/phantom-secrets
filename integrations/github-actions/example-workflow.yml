name: Phantom CI Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install the immutable Phantom v0.7.4 Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.4 --repo ashlrai/phantom-secrets \
            --pattern phantom-x86_64-unknown-linux-gnu.tar.gz \
            --pattern phantom-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c phantom-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf phantom-x86_64-unknown-linux-gnu.tar.gz
          install -d "$HOME/.local/bin"
          install -m 0755 phantom phantom-mcp "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check for unprotected secrets
        run: phantom check

      - name: Build
        run: npm ci && npm run build

# Direct Phantom Cloud pulls from GitHub Actions are not supported in this
# release. Sync deploy-time secrets to Vercel or Railway with `phantom sync`,
# then let that platform inject secrets during deployment.
