name: 'Phantom Secrets'
description: 'Unsupported placeholder for the Phantom GitHub Action.'
author: 'AshlrAI'

branding:
  icon: 'lock'
  color: 'blue'

inputs:
  working-directory:
    description: 'Directory containing .phantom.toml. Kept for compatibility; not used while the action is disabled.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: GitHub Action unavailable
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "::error::The Phantom GitHub Action is disabled in this release."
        echo "::error::The CLI does not currently provide non-interactive Phantom Cloud auth for GitHub Actions."
        echo "::error::Use supported CI patterns in docs/ci-cd.md, such as syncing secrets to Vercel or Railway before deploy."
        exit 1
