<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Phantom keeps the API key in a local vault</title>
  <desc id="heroDesc">The agent reads phm_ placeholders. A proxy on 127.0.0.1 adds the vault value only to a matched route.</desc>
  <rect width="960" height="420" rx="28" fill="#0b0b14"/>
  <text x="48" y="58" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">What the agent reads</text>
  <text x="356" y="58" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Local proxy</text>
  <text x="664" y="58" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">What the API receives</text>
  <rect x="40" y="78" width="270" height="250" rx="18" fill="#101018" stroke="#252538"/>
  <text x="64" y="118" fill="#808096" font-family="ui-monospace, monospace" font-size="13">.env</text>
  <text x="64" y="162" fill="#f5f5f7" font-family="ui-monospace, monospace" font-size="15">OPENAI_API_KEY=</text>
  <text x="64" y="186" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="15">phm_example</text>
  <text x="64" y="230" fill="#f5f5f7" font-family="ui-monospace, monospace" font-size="15">STRIPE_SECRET_KEY=</text>
  <text x="64" y="254" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="15">phm_example</text>
  <text x="64" y="298" fill="#808096" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Names only. No provider key.</text>
  <rect x="348" y="78" width="264" height="250" rx="18" fill="#101018" stroke="#3b82f6"/>
  <text x="372" y="122" fill="#f5f5f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">127.0.0.1</text>
  <text x="372" y="168" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Match one built-in route</text>
  <text x="372" y="196" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Drop client control of</text>
  <text x="372" y="218" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">that route auth header</text>
  <text x="372" y="258" fill="#22c55e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Inject the vault value</text>
  <text x="372" y="290" fill="#808096" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Unknown routes fail closed</text>
  <rect x="652" y="78" width="268" height="250" rx="18" fill="#101018" stroke="#252538"/>
  <text x="676" y="122" fill="#808096" font-family="ui-monospace, monospace" font-size="13">Authorization</text>
  <text x="676" y="166" fill="#f5f5f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">route-owned</text>
  <text x="676" y="192" fill="#f5f5f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">vault value</text>
  <text x="676" y="246" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Sent over TLS</text>
  <text x="676" y="274" fill="#a1a1b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">to the provider</text>
  <text x="48" y="372" fill="#808096" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Placeholders are not provider keys. Client headers and bodies never resolve them.</text>
  <text x="48" y="396" fill="#808096" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Examples use phm_example. They are not secret values.</text>
</svg>
