[workspace]
members = [
    "crates/phantom-cli",
    "crates/phantom-core",
    "crates/phantom-vault",
    "crates/phantom-proxy",
    "crates/phantom-mcp",
    "crates/phantom-authority",
    "crates/phantom-locus-contract",
    "crates/phantom-broker",
    "crates/phantom-runtime",
    "crates/phantom-evidence",
    "crates/phantom-session",
    "crates/phantom-workspace",
]
resolver = "2"

[workspace.package]
version = "0.7.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/ashlrai/phantom-secrets"
homepage = "https://phm.dev"
description = "Open-source CLI that reduces API-key exposure on supported AI-agent workflows"
authors = ["Mason Wyatt <mason@ashlr.ai>"]
readme = "README.md"
publish = ["crates-io"]

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto & security
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
cap-std = "=3.4.6"
cap-fs-ext = "=3.4.6"

# Internal crates — version + path is required so crates.io publishes
# work (path is used during local dev, version is what crates.io resolves).
# Crates published as `phantom-secrets-*` because `phantom-core`, `phantom`,
# and similar bare names are already taken on crates.io. The internal Rust
# crate names stay `phantom_core`, `phantom_vault`, etc. via `[lib] name`
# in each child Cargo.toml — so `use phantom_core::...` is unchanged.
phantom-core = { path = "crates/phantom-core", version = "0.7.4", package = "phantom-secrets-core" }
phantom-vault = { path = "crates/phantom-vault", version = "0.7.4", package = "phantom-secrets-vault" }
phantom-proxy = { path = "crates/phantom-proxy", version = "0.7.4", package = "phantom-secrets-proxy" }
phantom-mcp = { path = "crates/phantom-mcp", version = "0.7.4", package = "phantom-secrets-mcp" }
phantom-authority = { path = "crates/phantom-authority", version = "0.7.4", package = "phantom-secrets-authority" }
phantom-locus-contract = { path = "crates/phantom-locus-contract", version = "0.7.4", package = "phantom-secrets-locus-contract" }
phantom-broker = { path = "crates/phantom-broker", version = "0.7.4", package = "phantom-secrets-broker" }
phantom-runtime = { path = "crates/phantom-runtime", version = "0.7.4", package = "phantom-secrets-runtime" }
phantom-evidence = { path = "crates/phantom-evidence", version = "0.7.4", package = "phantom-secrets-evidence" }
phantom-session = { path = "crates/phantom-session", version = "0.7.4", package = "phantom-secrets-session" }
phantom-workspace = { path = "crates/phantom-workspace", version = "0.7.4", package = "phantom-secrets-workspace" }

# The issuance/JWT tests generate a throwaway RSA keypair at runtime (via the
# `rsa` dev-dependency) instead of committing a fixture key — no private key
# material lives in the repo. Pure-Rust RSA keygen is punishingly slow when its
# bignum backend is built at opt-level 0 (several seconds per 2048-bit key), so
# force these two math-heavy crates to compile optimized even in the dev/test
# profile. This keeps `cargo test` keygen at ~100-300ms. Overrides for packages
# outside the current build graph are ignored, so this is inert for non-test
# builds where `rsa` is not linked.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
